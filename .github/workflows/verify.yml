name: Verify desktop source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} correctness
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run provision:engines
      - run: npm run verify
      - run: npm run validate:platform
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-validation-${{ runner.os }}
          path: |
            build/platform-validation-*.json
            build/format-validation-*.json
          if-no-files-found: error

  parity:
    name: Cross-platform Oracle parity
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: parity
      - name: Compare platform snapshots
        shell: bash
        run: |
          snapshots=( $(find parity -type f -name 'platform-validation-*.json' | sort) )
          test "${#snapshots[@]}" -eq 2
          node scripts/compare-platform-validation.mjs "${snapshots[0]}" "${snapshots[1]}"

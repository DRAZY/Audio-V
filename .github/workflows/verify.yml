name: Verify desktop source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} correctness
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run provision:engines
      - run: npm run verify
      - run: npm run validate:platform
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-validation-${{ runner.os }}
          path: |
            build/platform-validation-*.json
            build/format-validation-*.json
          if-no-files-found: error

  parity:
    name: Cross-platform Oracle parity
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parity
      - name: Compare platform snapshots
        shell: bash
        run: |
          snapshots=( $(find parity -type f -name 'platform-validation-*.json' | sort) )
          test "${#snapshots[@]}" -eq 2
          node scripts/compare-platform-validation.mjs "${snapshots[0]}" "${snapshots[1]}"
